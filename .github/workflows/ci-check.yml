name: ci-check
on:
  push:
    branches: [ci-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: NODE_PATH=/tmp/pw/node_modules node .promo/make.js
      - run: |
          git config user.name ci && git config user.email ci@example.com
          git checkout -b promo-out && git add -f promo/NursingCareerBD-promo.mp4 promo/shot*.png && git commit -qm out && git push -f origin promo-out
