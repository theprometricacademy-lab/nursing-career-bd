name: ci-check
on:
  push:
    branches: [ci-check]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/pw/node_modules node .cardshot/shot.js
      - run: |
          for f in out/*.png; do npx --prefix /tmp/pw -y -q playwright --version >/dev/null; done
          git config user.name ci && git config user.email ci@example.com
          git checkout -b cardshot-out && git add -f out && git commit -qm out && git push -f origin cardshot-out
