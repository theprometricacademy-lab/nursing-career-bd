name: ci-check
on:
  push:
    branches: [ci-check]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/pw/node_modules node .cardshot/shot.js
      - uses: actions/upload-artifact@v4
        with: { name: cards, path: out/ }
