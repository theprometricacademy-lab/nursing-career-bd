name: reel-tts
on:
  workflow_dispatch:
  push:
    branches: [reel-assets]
    paths: ['tts/**', '.github/workflows/tts.yml']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --quiet edge-tts
      - run: python tts/gen_edge.py
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out
          git commit -m "TTS outputs [skip ci]"
          git push
