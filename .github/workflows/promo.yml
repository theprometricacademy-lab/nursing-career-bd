name: promo-video
on:
  push:
    branches: [promo-video]
    paths: ['promo/**', '.github/workflows/promo.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
      - run: pip install edge-tts==6.1.12
      - working-directory: promo
        run: npm init -y > /dev/null && npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - working-directory: promo
        run: ./build.sh
      - name: commit video
        run: |
          mkdir -p out && cp promo/promo.mp4 out/nursing-career-bd-promo.mp4 && cp promo/durs.json out/
          git config user.name "promo-bot" && git config user.email "promo-bot@users.noreply.github.com"
          git add out && git commit -m "Rendered promo video [skip ci]" && git push
