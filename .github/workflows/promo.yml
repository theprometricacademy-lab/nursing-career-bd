name: promo-video
on:
  push:
    branches: [promo-video]
    paths: ['promo/**', '.github/workflows/promo.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
      - run: pip install -U edge-tts
      - working-directory: promo
        run: npm init -y > /dev/null && npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - working-directory: promo
        run: set -o pipefail; ./build.sh 2>&1 | tee build.log
      - name: commit video
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          mkdir -p out; cp promo/build.log out/; cp promo/promo.mp4 out/nursing-career-bd-promo.mp4; cp promo/durs.json out/
          echo "::warning::files $(ls -la out | tr '\n' ' ')"
          echo "::warning::tail $(tail -c 600 promo/build.log | tr '\n' ' ')"
          git config user.name "promo-bot"; git config user.email "promo-bot@users.noreply.github.com"
          git add out; out=$(git commit -m "Rendered promo video [skip ci]" 2>&1); echo "::warning::commit $(echo $out | tail -c 300)"
          out=$(git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/promo-video 2>&1); rc=$?
          echo "::warning::push rc=$rc $(echo $out | tail -c 400)"
          exit $rc
